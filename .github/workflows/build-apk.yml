name: Build PureTube APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
      - name: Install dependencies
        run: cd puretube && flutter pub get
      - name: Build APK
        run: cd puretube && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PureTube-APK
          path: puretube/build/app/outputs/flutter-apk/app-release.apk
